services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: korp
      POSTGRES_PASSWORD: korp
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U korp"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025" # UI
      - "1025:1025" # SMTP

  estoque:
    build:
      context: ./backend
      dockerfile: build/Dockerfile
      args:
        SERVICE: estoque
    environment:
      PORT: "8082"
      DATABASE_URL: postgres://korp:korp@postgres:5432/estoque_db?sslmode=disable
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  faturamento:
    build:
      context: ./backend
      dockerfile: build/Dockerfile
      args:
        SERVICE: faturamento
    environment:
      PORT: "8083"
      DATABASE_URL: postgres://korp:korp@postgres:5432/faturamento_db?sslmode=disable
      ESTOQUE_URL: http://estoque:8082
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      MAIL_FROM: noreply@korp.local
      NOTA_CONFIRMACAO_EMAIL: cliente@korp.local
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth:
    build:
      context: ./backend
      dockerfile: build/Dockerfile
      args:
        SERVICE: auth
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://korp:korp@postgres:5432/auth_db?sslmode=disable
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      MAIL_FROM: noreply@korp.local
      APP_BASE_URL: http://localhost:8081
      JWT_SECRET: troque-esse-segredo-em-producao
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
    environment:
      ESTOQUE_URL: http://localhost:8082
      FATURAMENTO_URL: http://localhost:8083
      AUTH_URL: http://localhost:8081
    ports:
      - "4200:80"
    depends_on:
      estoque:
        condition: service_healthy
      faturamento:
        condition: service_healthy
      auth:
        condition: service_healthy

volumes:
  pgdata:
