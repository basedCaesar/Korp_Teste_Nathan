<div class="cabecalho">
  <h1>Notas fiscais</h1>
  <button mat-flat-button color="primary" (click)="nova()" [disabled]="criando()">
    <mat-icon>add</mat-icon>
    Nova nota
  </button>
</div>

@if (carregando()) {
  <div class="carregando">
    <mat-spinner diameter="32"></mat-spinner>
  </div>
} @else {
  <div class="superficie">
    @if (notas().length === 0) {
      <div class="estado-vazio">
        <mat-icon>receipt_long</mat-icon>
        <p>Nenhuma nota criada ainda.</p>
      </div>
    } @else {
      <table mat-table [dataSource]="notas()" class="tabela">
        <ng-container matColumnDef="numero">
          <th mat-header-cell *matHeaderCellDef>Número</th>
          <td mat-cell *matCellDef="let nota"><span class="numero">#{{ nota.numero }}</span></td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let nota">
            <span class="status-badge" [class]="'status-' + nota.status.toLowerCase()">{{ nota.status }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="criada_em">
          <th mat-header-cell *matHeaderCellDef>Criada em</th>
          <td mat-cell *matCellDef="let nota">{{ nota.created_at | date: 'dd/MM/yyyy HH:mm' }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="colunas"></tr>
        <tr mat-row *matRowDef="let row; columns: colunas" (click)="abrir(row)" class="linha-clicavel"></tr>
      </table>
    }
  </div>
}
