<div class="cabecalho">
  <h1>Produtos</h1>
  <button mat-flat-button color="primary" (click)="novo()">
    <mat-icon>add</mat-icon>
    Novo produto
  </button>
</div>

@if (carregando()) {
  <div class="carregando">
    <mat-spinner diameter="32"></mat-spinner>
  </div>
} @else {
  <div class="superficie">
    @if (produtos().length === 0) {
      <div class="estado-vazio">
        <mat-icon>inventory_2</mat-icon>
        <p>Nenhum produto cadastrado ainda.</p>
      </div>
    } @else {
      <table mat-table [dataSource]="produtos()" class="tabela">
        <ng-container matColumnDef="codigo">
          <th mat-header-cell *matHeaderCellDef>Código</th>
          <td mat-cell *matCellDef="let produto"><span class="codigo">{{ produto.codigo }}</span></td>
        </ng-container>

        <ng-container matColumnDef="descricao">
          <th mat-header-cell *matHeaderCellDef>Descrição</th>
          <td mat-cell *matCellDef="let produto">{{ produto.descricao }}</td>
        </ng-container>

        <ng-container matColumnDef="saldo">
          <th mat-header-cell *matHeaderCellDef>Saldo</th>
          <td mat-cell *matCellDef="let produto">{{ produto.saldo }}</td>
        </ng-container>

        <ng-container matColumnDef="acoes">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let produto" class="acoes">
            <button mat-icon-button (click)="editar(produto)" aria-label="Editar">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button (click)="excluir(produto)" aria-label="Excluir">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="colunas"></tr>
        <tr mat-row *matRowDef="let row; columns: colunas"></tr>
      </table>
    }
  </div>
}
